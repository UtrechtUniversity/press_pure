[CREDENTIALS]
APIKEY = pureapikey
APIKEY_CRUD = pureapikeycrud
BASEURL = https://research-portal.uu.nl/ws/api/524/
BASEURL_CRUD = https://research-portal.uu.nl/ws/api/
OPENAI_API =
MISTRAL_API =
GOOGLE_API =
GOOGLE_CX =

[DEFAULTS]
ALLOWED_LANGUAGES = en, nl, de, fr, es, it, pt, sv, da, no, fi, pl, cs, sk, ro, hu, el, bg, hr, lt, lv, et, sl, af

[AI]
AI = True
PROVIDER = openai
MODEL = gpt-4o-mini
# For Mistral, use:
# PROVIDER = mistral
# MODEL = mistral-small-latest

# Example for an installation allowing only Research cited. Discover your own
# roles through GET /pressmedia/allowed-media-coverages-persons-roles first.
[PURE_CLIPPING]
DEFAULT_RESEARCHER_ROLE = researchcited
IMPORTED_KEYWORD_GROUP_ENABLED = false
IMPORTED_KEYWORD_GROUP_LOGICAL_NAME =
IMPORTED_KEYWORD_CLASSIFICATION_URI =
FREE_KEYWORDS_GROUP_LOGICAL_NAME = keywordContainers

[PURE_ROLE:researchcited]
URI = /dk/atira/pure/clipping/roles/clipping/researchcited
LABEL = Research cited
COVERAGE_TYPE = Coverage

# Add more PURE_ROLE:<key> sections only when supported by your installation.
# Existing author/interviewee/participant roles use COVERAGE_TYPE = Contribution.

[QUERY]
FACULTY_TERMS = faculteit, faculty, school
# Literal whole-token prefixes; e.g. TS for Tilburg Schools. Empty by default.
FACULTY_PREFIXES =

[FACULTY_ALIASES]
# Exact, case-insensitive source = canonical faculty name (optional).
# TS Economics and Management = Tilburg School of Economics and Management

[NAME]
DUTCH = universiteit utrecht
ENGLISH = utrecht university

[FILTERS]
UNWANTED_TERMS = \bUtrecht University\b, \bUniversiteit Utrecht\b, \bUniversiteit\b, \bUtrecht\b
BLACKLIST_NAMES = Anton Pijpers, David Beverborg

[SOURCE_MAP]
fd.nl = https://fd.nl
volkskrant.nl = https://www.volkskrant.nl
ad.nl = https://www.ad.nl
tech daily news = https://www.techdailynews.com
nature geoscience = https://www.nature.com/ngeo
ncbi = https://www.ncbi.nlm.nih.gov
open universiteit = https://www.ou.nl
nscr = https://nscr.nl
movisie.nl = https://www.movisie.nl
university world news = https://www.universityworldnews.com
annekeschrijft.com = https://annekeschrijft.com
po-raad.nl = https://www.poraad.nl

[WORKFLOW STATUS]
GEO = entryInProgress
GW = entryInProgress
FSW = entryInProgress
REBO = forApproval
BETA = forApproval
DGK = approved
